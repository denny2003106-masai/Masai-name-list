<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111827">
    <title>馬賽名單傳遞系統 - V 1.009</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- SortableJS for Drag and Drop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tech: {
                            bg: '#111827', // Gray 900
                            surface: '#1F2937', // Gray 800
                            primary: '#06B6D4', // Cyan 500
                            secondary: '#10B981', // Emerald 500
                            accent: '#F472B6', // Pink 400
                        }
                    },
                    boxShadow: {
                        'neon-blue': '0 0 5px #06B6D4, 0 0 10px #06B6D4',
                        'neon-green': '0 0 5px #10B981, 0 0 10px #10B981',
                        'neon-red': '0 0 5px #EF4444, 0 0 10px #EF4444',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #111827;
            color: #E5E7EB;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1F2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4B5563;
        }
        .btn-tech {
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .btn-tech:active {
            transform: scale(0.96);
        }
        /* Tab active state */
        .tab-active {
            border-bottom: 3px solid #06B6D4;
            color: #06B6D4;
            background-color: rgba(6, 182, 212, 0.1);
        }
        .tab-inactive {
            border-bottom: 3px solid transparent;
            color: #6B7280;
        }
        .tab-active-host {
            border-bottom: 3px solid #10B981;
            color: #10B981;
            background-color: rgba(16, 185, 129, 0.1);
        }
        /* Mobile Touch Optimizations */
        input, button {
            touch-action: manipulation;
        }
        /* Drag Handle Style */
        .drag-handle {
            touch-action: none;
            cursor: grab;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
        .sortable-ghost {
            opacity: 0.4;
            background-color: #1F2937;
            border: 2px dashed #06B6D4;
        }
        /* Modal Overlay */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
        }
        
        /* Light Theme Overrides (白底黑字模式) */
        html.light-mode body { background-color: #f9fafb; color: #111827; }
        html.light-mode .bg-gray-800, html.light-mode .bg-gray-900 { background-color: #ffffff; border-color: #d1d5db; color: #111827; }
        html.light-mode .text-white { color: #111827; }
        html.light-mode .text-gray-300, html.light-mode .text-gray-400, html.light-mode .text-gray-500 { color: #4b5563; }
        html.light-mode .border-gray-600, html.light-mode .border-gray-700, html.light-mode .border-gray-800 { border-color: #d1d5db; }
        html.light-mode input.bg-gray-900 { background-color: #f3f4f6; color: #111827; border-color: #d1d5db; }
        html.light-mode .text-cyan-400, html.light-mode .text-cyan-500, html.light-mode .text-cyan-300 { color: #0891b2; }
        html.light-mode .text-emerald-400, html.light-mode .text-emerald-500, html.light-mode .text-emerald-300 { color: #059669; }
        html.light-mode .text-yellow-400 { color: #d97706; }
        html.light-mode .tab-active { background-color: rgba(8, 145, 178, 0.1); color: #0891b2; border-bottom-color: #0891b2; }
        html.light-mode .tab-active-host { background-color: rgba(5, 150, 105, 0.1); color: #059669; border-bottom-color: #059669; }
        html.light-mode .sortable-ghost { background-color: #f3f4f6; }
        html.light-mode .shadow-neon-blue, html.light-mode .shadow-neon-green { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        /* Orientation Lock Overlay (方向鎖定提示) */
        #orientation-warning {
            display: none;
            position: fixed;
            inset: 0;
            background: #111827;
            z-index: 99999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            color: #06B6D4;
        }
        html.light-mode #orientation-warning { background: #f9fafb; color: #0891b2; }
        
        /* 手機 (最大寬度 767px 且為觸控) + 橫式 => 強制要求轉為直式 */
        @media (pointer: coarse) and (max-device-width: 767px) and (orientation: landscape) {
            #app, .absolute.top-0, .absolute.bottom-0, .absolute.top-4 { display: none !important; }
            #orientation-warning { display: flex !important; }
            #orientation-warning-text:after { content: '偵測到手機橫放，請將手機轉為直式 (Portrait) 瀏覽。'; }
        }
        
        /* 電腦 (非觸控滑鼠) + 直式 => 強制要求轉為橫式 */
        @media (pointer: fine) and (orientation: portrait) {
            #app, .absolute.top-0, .absolute.bottom-0, .absolute.top-4 { display: none !important; }
            #orientation-warning { display: flex !important; }
            #orientation-warning-text:after { content: '偵測到直式視窗，電腦版請將視窗調整為橫式 (Landscape) 瀏覽以獲得最佳體驗。'; }
        }
    </style>
</head>
<body class="min-h-[100dvh] w-full flex flex-col items-center justify-start sm:justify-center p-2 sm:p-4 relative overflow-hidden text-base">

    <!-- Orientation Warning Overlay -->

    <!-- Theme Toggle Button -->

    <!-- Background Decoration -->

    <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-emerald-500 to-transparent opacity-50"></div>
    
    <!-- App Container -->
    <div id="app" class="w-[95%] max-w-4xl relative z-10 flex flex-col h-[98dvh] sm:h-[90dvh] mt-2 sm:mt-0">
        <!-- Header Loading -->
        <div class="text-center mb-2 flex-none">
             <div id="loading-screen" class="flex flex-col items-center justify-center space-y-4 py-8">

                <p class="text-cyan-400 animate-pulse text-sm">系統連線中...</p>
            </div>
        </div>

        <!-- Role Selection (Home) -->
        <div id="home-view" class="hidden text-center space-y-6 animate-fade-in flex-1 flex flex-col justify-center px-4">
            <!-- Title -->
            <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400 mb-4 tracking-wider leading-tight break-words">
                馬賽名單傳遞系統
            </h1>
            
            <div class="grid grid-cols-1 gap-4 w-full max-w-sm mx-auto">
                <button onclick="router.navigate('reception')" class="group relative p-6 bg-gray-800 rounded-xl border border-cyan-500/30 hover:border-cyan-400 hover:shadow-neon-blue transition-all duration-300 flex items-center justify-start space-x-4">
                    <div class="bg-cyan-900/30 p-3 rounded-full">
                        <i class="fas fa-user-edit text-3xl text-cyan-400"></i>
                    </div>
                    <div class="text-left">
                        <h2 class="text-xl text-white font-bold">接待端</h2>
                        <p class="text-gray-400 text-xs">Guest Reception</p>
                    </div>
                    <div class="flex-1 text-right">
                        <i class="fas fa-chevron-right text-gray-600 group-hover:text-cyan-400 transition-colors"></i>
                    </div>
                </button>

                <button onclick="router.navigate('host-login')" class="group relative p-6 bg-gray-800 rounded-xl border border-emerald-500/30 hover:border-emerald-400 hover:shadow-neon-green transition-all duration-300 flex items-center justify-start space-x-4">
                    <div class="bg-emerald-900/30 p-3 rounded-full">
                        <i class="fas fa-microphone-lines text-3xl text-emerald-400"></i>
                    </div>
                    <div class="text-left">
                        <h2 class="text-xl text-white font-bold">主持端</h2>
                        <p class="text-gray-400 text-xs">Event Host</p>
                    </div>
                    <div class="flex-1 text-right">
                        <i class="fas fa-chevron-right text-gray-600 group-hover:text-emerald-400 transition-colors"></i>
                    </div>
                </button>
            </div>
        </div>

        <!-- Reception View -->
        <div id="reception-view" class="hidden w-full max-w-md mx-auto flex-1 flex flex-col overflow-hidden">
            <div class="flex justify-between items-center mb-2 flex-none px-1">
                <button onclick="router.navigate('home')" class="text-gray-400 hover:text-white transition-colors text-sm">
                    <i class="fas fa-arrow-left"></i> 主選單
                </button>
                <div class="flex items-center space-x-3">
                    <a href="https://docs.google.com/spreadsheets/d/1C12hARLyp9csxwLTtJmYPu6ATRJRCCo7cif7r3s4JZ4/edit" target="_blank" class="text-emerald-400 hover:text-emerald-300 text-xs font-bold transition-colors">
                        <i class="fas fa-file-excel mr-1"></i>名單設定
                    </a>
                    <h2 class="text-cyan-400 font-bold tracking-widest text-sm">>> RECEPTION</h2>
                </div>
            </div>

            <!-- Reception Tabs -->
            <div class="flex space-x-1 mb-2 flex-none overflow-x-auto whitespace-nowrap">
                <button onclick="switchReceptionTab('input')" id="rec-tab-input" class="flex-1 py-3 px-1 text-sm sm:text-base font-bold transition-colors tab-active">
                    <i class="fas fa-edit mr-1"></i> 新增
                </button>
                <button onclick="switchReceptionTab('list')" id="rec-tab-list" class="flex-1 py-3 px-1 text-sm sm:text-base font-bold transition-colors tab-inactive">
                    <i class="fas fa-list mr-1"></i> 未介紹 <span id="reception-count" class="ml-1 bg-gray-700 text-cyan-300 text-xs px-1.5 py-0.5 rounded-full">0</span>
                </button>
                <button onclick="switchReceptionTab('introduced')" id="rec-tab-introduced" class="flex-1 py-3 px-1 text-sm sm:text-base font-bold transition-colors tab-inactive">
                    <i class="fas fa-check-double mr-1"></i> 已介紹 <span id="reception-count-intro" class="ml-1 bg-gray-700 text-emerald-300 text-xs px-1.5 py-0.5 rounded-full">0</span>
                </button>
            </div>

            <!-- Tab Content: Input Form -->
            <div id="rec-content-input" class="bg-gray-800 p-4 sm:p-6 rounded-xl border border-gray-700 shadow-xl relative flex-1 flex flex-col justify-start overflow-y-auto">
                <div class="absolute top-0 left-0 w-1 h-full bg-cyan-500"></div>
                
                <form id="checkin-form" onsubmit="handleCheckIn(event)" class="space-y-4 flex-none">
                    <div>
                        <label class="block text-cyan-500 text-sm font-bold mb-1 uppercase tracking-wider">職稱 / Title</label>
                        <input type="text" id="input-title" required class="w-full bg-gray-900 text-white border border-gray-600 rounded-lg p-3 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all text-lg" placeholder="例：理事長">
                    </div>
                    
                    <div>
                        <label class="block text-cyan-500 text-sm font-bold mb-1 uppercase tracking-wider">姓名 / Name</label>
                        <input type="text" id="input-name" required class="w-full bg-gray-900 text-white border border-gray-600 rounded-lg p-3 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all text-lg" placeholder="例：陳大文">
                    </div>

                    <button type="submit" class="btn-tech w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg hover:shadow-neon-blue text-lg mt-2">
                        <i class="fas fa-check-circle mr-2"></i> 確認簽到
                    </button>
                </form>

                <!-- Preload List Section -->
                <div class="mt-6 pt-4 border-t border-gray-700 flex-1 flex flex-col min-h-0">
                    <div class="flex justify-between items-center mb-3 flex-none">
                        <div class="flex items-center space-x-3">
                            <h3 class="text-cyan-500 text-sm font-bold uppercase tracking-wider"><i class="fas fa-cloud-download-alt mr-1"></i> 預先輸入名單</h3>
                            <a href="https://docs.google.com/spreadsheets/d/1C12hARLyp9csxwLTtJmYPu6ATRJRCCo7cif7r3s4JZ4/edit?usp=sharing" target="_blank" class="text-emerald-400 hover:text-emerald-300 text-xs bg-emerald-900/30 px-2 py-1 rounded border border-emerald-800 transition-colors flex items-center">
                                <i class="fas fa-external-link-alt mr-1"></i> 打開名單
                            </a>
                        </div>
                        <button type="button" onclick="fetchPreloadGuests()" class="text-gray-400 hover:text-cyan-400 text-xs bg-gray-900 px-2 py-1 rounded border border-gray-700 transition-colors">
                            <i class="fas fa-sync-alt"></i> 更新
                        </button>
                    </div>
                    <div id="preload-list-container" class="flex flex-wrap gap-2 pb-4 overflow-y-auto max-h-[35vh] sm:max-h-[45vh] items-start content-start flex-1">
                        <!-- Preload buttons injected here -->
                    </div>
                </div>

                <div id="success-msg" class="hidden absolute bottom-4 left-0 right-0 mx-4 p-3 bg-green-900/90 border border-green-500 text-green-300 text-center rounded-lg animate-pulse z-20 shadow-lg">
                    <i class="fas fa-check"></i> 簽到成功！
                </div>
            </div>

            <!-- Tab Content: List (Hidden by default) -->
            <div id="rec-content-list" class="bg-gray-800 border border-gray-700 rounded-xl p-2 flex-1 overflow-y-auto hidden">
                <div id="reception-list-container" class="space-y-2 pb-16">
                    <!-- Items injected here -->
                </div>
            </div>
            
            <!-- Tab Content: Introduced (Hidden by default) -->
            <div id="rec-content-introduced" class="bg-gray-800 border border-gray-700 rounded-xl p-2 flex-1 overflow-y-auto hidden">
                <div id="reception-intro-list-container" class="space-y-2 pb-16">
                    <!-- Items injected here -->
                </div>
            </div>
        </div>

        <!-- Host Login View -->
        <div id="host-login-view" class="hidden w-full max-w-sm mx-auto text-center flex-1 flex flex-col justify-center px-4">
            <button onclick="router.navigate('home')" class="absolute top-4 left-4 text-gray-500 hover:text-white p-2">
                <i class="fas fa-arrow-left fa-lg"></i>
            </button>
            
            <div class="bg-gray-800 p-8 rounded-xl border border-emerald-600 shadow-neon-green">
                <i class="fas fa-lock text-4xl text-emerald-400 mb-4"></i>
                <h2 class="text-xl text-white font-bold mb-6">SECURITY ACCESS</h2>
                
                <input type="password" id="host-password" inputmode="numeric" pattern="[0-9]*" class="w-full bg-gray-900 text-center text-white border border-emerald-500/50 rounded p-4 mb-4 focus:outline-none focus:border-emerald-400 tracking-widest text-2xl" placeholder="PASSCODE">
                
                <button onclick="verifyHost()" class="btn-tech w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg text-lg">
                    ACCESS
                </button>
                <p id="login-error" class="text-red-400 text-sm mt-3 hidden">密碼錯誤</p>
            </div>
        </div>

        <!-- Host Dashboard View -->
        <div id="host-dashboard-view" class="hidden w-full h-full flex flex-col">
            <!-- Top Bar -->
            <div class="flex justify-between items-center mb-2 pb-2 border-b border-gray-800 flex-none px-2">
                <button onclick="router.navigate('home')" class="text-gray-500 hover:text-white text-sm">
                    <i class="fas fa-sign-out-alt"></i> 離開
                </button>
                <div class="text-emerald-400 font-bold text-lg tracking-wide flex items-center">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse mr-2"></span>
                    DASHBOARD
                </div>
                <div class="flex items-center space-x-3">
                    <div class="text-xs text-gray-500 font-mono" id="clock">00:00</div>
                    <!-- Clear All Button -->
                    <button onclick="requestClearAll()" class="text-red-500 hover:text-white bg-red-900/30 border border-red-900/50 rounded px-2 py-1 flex items-center transition-colors shadow-sm" title="全部清除">
                        <i class="fas fa-dumpster-fire mr-1"></i><span class="text-xs font-bold tracking-wider">全刪</span>
                    </button>
                </div>
            </div>

            <!-- Tabs -->
            <div class="flex space-x-1 mb-2 flex-none">
                <button onclick="switchHostTab('waiting')" id="tab-waiting" class="flex-1 py-3 text-base font-bold transition-colors tab-active-host">
                    <i class="fas fa-hourglass-half mr-1"></i> 未介紹 <span id="count-waiting-badge" class="ml-1 bg-gray-700 text-white text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
                <button onclick="switchHostTab('introduced')" id="tab-introduced" class="flex-1 py-3 text-base font-bold transition-colors tab-inactive">
                    <i class="fas fa-check-double mr-1"></i> 已介紹 <span id="count-introduced-badge" class="ml-1 bg-gray-700 text-white text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>

            <!-- Content Area -->
            <div class="flex-1 overflow-hidden relative bg-gray-900/50 rounded-xl border border-gray-800">
                <!-- Waiting List (Sortable) -->
                <div id="host-list-waiting" class="absolute inset-0 overflow-y-auto p-2 sm:p-4 space-y-3 pb-20">
                    <!-- Items injected here -->
                </div>

                <!-- Introduced List -->
                <div id="host-list-introduced" class="absolute inset-0 overflow-y-auto p-2 sm:p-4 space-y-3 hidden pb-20">

                </div>
            </div>
        </div>

        <!-- Password Modal -->

            <div class="bg-gray-800 border border-gray-600 rounded-xl shadow-2xl w-full max-w-sm p-6 transform transition-all scale-100">
                <h3 class="text-white text-xl font-bold mb-4 flex items-center">
                    <i class="fas fa-shield-alt text-cyan-400 mr-2"></i> 安全驗證
                </h3>
                <p id="modal-desc" class="text-gray-400 text-sm mb-4">請輸入密碼以繼續操作。</p>
                
                <input type="password" id="modal-password" inputmode="numeric" pattern="[0-9]*" class="w-full bg-gray-900 text-center text-white border border-gray-600 rounded-lg p-3 mb-2 focus:outline-none focus:border-cyan-500 tracking-widest text-lg" placeholder="密碼">
                <p id="modal-error" class="text-red-400 text-xs min-h-[1.2em] mb-4"></p>

                <div class="flex space-x-3">
                    <button onclick="closePasswordModal()" class="flex-1 py-2 bg-gray-700 text-gray-300 rounded-lg hover:bg-gray-600">取消</button>
                    <button onclick="confirmPasswordAction()" class="flex-1 py-2 bg-red-600 text-white rounded-lg hover:bg-red-500 shadow-lg shadow-red-900/50">確認刪除</button>
                </div>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="flex-none mt-2 text-center pb-2 safe-area-pb">
            <p class="text-gray-600 text-[10px] font-mono">
                開發：馬賽國小 資訊組 | <span id="app-version">V 1.009</span>
            </p>
        </div>

    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, writeBatch, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Configuration & Init ---
        // 這裡已經換成您的 masai-name-list 專屬金鑰
        const firebaseConfig = {
            apiKey: "AIzaSyAPiGANMJytLAy8roar7kpCKj29M0734oY",
            authDomain: "masai-name-list.firebaseapp.com",
            projectId: "masai-name-list",
            storageBucket: "masai-name-list.firebasestorage.app",
            messagingSenderId: "598542565639",
            appId: "1:598542565639:web:c8d15f92a0a1e3b95545a2",
            measurementId: "G-YGNR7QQJFX"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // 簡化資料庫路徑，現在所有資料會存在 Firestore 第一層的 "guests" 集合中
        const COLLECTION_NAME = 'guests'; 
        
        // Version Control
        const APP_VERSION = "V 1.009";
        document.getElementById('app-version').innerText = APP_VERSION;

        // --- App State ---
        let currentUser = null;
        let allGuests = [];
        let preloadData = []; // 暫存從 Google Sheets 抓取的原始名單
        let hostTabState = 'waiting';
        let receptionTabState = 'input';
        let sortableInstance = null;

        // --- Modal State ---
        let pendingAction = null; 
        let requiredPassword = '';

        // --- Router ---
        window.router = {
            current: 'loading',
            navigate: (viewId) => {
                window.router.current = viewId;
                document.querySelectorAll('[id$="-view"]').forEach(el => el.classList.add('hidden'));
                document.getElementById('loading-screen').parentElement.classList.add('hidden');
                
                const target = document.getElementById(`${viewId}-view`);
                if (target) {
                    target.classList.remove('hidden');
                    if(viewId === 'host-login') {
                        document.getElementById('host-password').value = '';
                        document.getElementById('login-error').classList.add('hidden');
                    }
                    if (viewId === 'host-dashboard' || viewId === 'reception') {
                        renderGuests();
                    }
                    if (viewId === 'reception') {
                        fetchPreloadGuests();
                    }
                }
            }
        };

        // --- Core Logic ---
        const initApp = async () => {
            try {
                await signInAnonymously(auth);

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        subscribeItems();
                        router.navigate('home');
                    }
                });
                
                setInterval(() => {
                    const now = new Date();
                    const clockEl = document.getElementById('clock');
                    if(clockEl) clockEl.innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                }, 1000);

            } catch (error) {
                console.error("Auth Error:", error);
                
                let errorText = "連線失敗，請重新整理網頁";
                if (error.code === 'auth/operation-not-allowed') {
                    errorText = "連線失敗：請至 Firebase 後台啟用「匿名 (Anonymous)」登入";
                } else if (error.code) {
                    errorText = `連線失敗 (${error.code})`;
                }
                
                document.querySelector('#loading-screen p').innerText = errorText;
                document.querySelector('#loading-screen p').classList.replace('text-cyan-400', 'text-red-400');
            }
        };

        // Database Subscription
        const itemsCollection = collection(db, COLLECTION_NAME);

        function subscribeItems() {
            if (!currentUser) return;

            onSnapshot(itemsCollection, (snapshot) => {
                const guests = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                
                guests.sort((a, b) => {
                    const orderA = a.customOrder ?? (a.createdAt?.seconds ? a.createdAt.seconds * 1000 : Date.now());
                    const orderB = b.customOrder ?? (b.createdAt?.seconds ? b.createdAt.seconds * 1000 : Date.now());
                    return orderA - orderB;
                });

                allGuests = guests;
                renderGuests();
            }, (error) => {
                console.error("Snapshot error:", error);
            });
        }

        // Create Item (Manual check-in)
        window.handleCheckIn = async (e) => {
            e.preventDefault();
            const titleInput = document.getElementById('input-title');
            const nameInput = document.getElementById('input-name');
            const btn = e.target.querySelector('button');
            const successMsg = document.getElementById('success-msg');

            const tVal = titleInput.value.trim();
            const nVal = nameInput.value.trim();

            if (!tVal || !nVal) return;
            if (!currentUser) return;

            // 檢查重複：若職稱與姓名完全相符，則阻擋寫入
            const isDuplicate = allGuests.some(g => g.title === tVal && g.name === nVal);
            if (isDuplicate) {
                alert("該來賓已存在名單中（未介紹或已介紹），無法重複新增！");
                return;
            }

            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>處理中...';
            btn.disabled = true;

            try {
                const newOrder = Date.now(); 
                await addDoc(itemsCollection, {
                    title: tVal,
                    name: nVal,
                    status: 'waiting',
                    customOrder: newOrder,
                    createdAt: serverTimestamp(),
                    createdBy: currentUser.uid
                });

                titleInput.value = '';
                nameInput.value = '';
                titleInput.focus();
                
                successMsg.classList.remove('hidden');
                setTimeout(() => successMsg.classList.add('hidden'), 3000);

            } catch (error) {
                console.error("Check-in failed:", error);
                alert("Check-in failed.");
            } finally {
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        };

        // Update Status
        window.toggleGuestStatus = async (id, currentStatus) => {
            if (!currentUser) return;
            try {
                const newStatus = currentStatus === 'waiting' ? 'introduced' : 'waiting';
                const docRef = doc(itemsCollection, id);
                await updateDoc(docRef, {
                    status: newStatus
                });
            } catch (error) {
                console.error("Status update failed:", error);
            }
        };

        // Preload Guests from Google Sheets
        window.fetchPreloadGuests = async () => {
            const sheetId = '1C12hARLyp9csxwLTtJmYPu6ATRJRCCo7cif7r3s4JZ4';
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&headers=1`;
            const container = document.getElementById('preload-list-container');
            
            container.innerHTML = '<div class="text-gray-400 text-xs w-full text-center py-4"><i class="fas fa-spinner fa-spin mr-2"></i>連線試算表讀取中...</div>';
            
            try {
                const response = await fetch(url);
                let text = await response.text();
                text = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(text);
                
                preloadData = [];
                if (data.table && data.table.rows && data.table.rows.length > 0) {
                    data.table.rows.forEach(row => {
                        const title = row.c[0] ? (row.c[0].v || '') : '';
                        const name = row.c[1] ? (row.c[1].v || '') : '';
                        if (title === '職稱' || name === '姓名') return;

                        if (title || name) {
                            preloadData.push({ title: title.toString().trim(), name: name.toString().trim() });
                        }
                    });
                } 
                
                renderPreloadList();
            } catch (error) {
                console.error('Fetch error:', error);
                container.innerHTML = '<div class="text-red-400 text-xs w-full bg-red-900/30 p-2 rounded border border-red-800">讀取失敗，請確認該試算表共用設定已開啟「知道連結的使用者皆可查看」。</div>';
            }
        };

        // 獨立渲染預先輸入名單，方便過濾已存在的來賓
        function renderPreloadList() {
            const container = document.getElementById('preload-list-container');
            if (!container) return;
            container.innerHTML = '';
            
            if (preloadData.length === 0) {
                container.innerHTML = '<div class="text-gray-500 text-xs w-full">試算表內目前無資料或尚未讀取。</div>';
                return;
            }

            let addedCount = 0;
            preloadData.forEach(guest => {
                // 檢查是否已在系統名單中 (未介紹或已介紹)
                const isDuplicate = allGuests.some(g => g.title === guest.title && g.name === guest.name);
                
                // 已經在名單內就跳過，不顯示按鈕
                if (isDuplicate) return;

                const btn = document.createElement('button');
                btn.className = 'bg-gray-800 text-left text-white text-sm py-2 px-3 rounded-lg border border-gray-600 hover:border-cyan-400 hover:bg-gray-700 transition-colors shadow-sm active:scale-95 flex-none max-w-full';
                btn.onclick = function() { window.quickCheckIn(guest.title, guest.name, this); };
                btn.innerHTML = `<span class="text-cyan-400 mr-2 text-xs opacity-80">${guest.title}</span><span class="font-bold">${guest.name}</span>`;
                container.appendChild(btn);
                addedCount++;
            });

            if (addedCount === 0) {
                container.innerHTML = '<div class="text-gray-500 text-xs w-full"><i class="fas fa-check-circle text-emerald-500 mr-1"></i>名單內的人員皆已報到完畢。</div>';
            }
        }

        // Quick Check-In from Preload List
        window.quickCheckIn = async (title, name, btnEl) => {
            if (!currentUser) {
                alert("未連線至資料庫");
                return;
            }
            
            // 雙重檢查機制
            if (allGuests.some(g => g.title === title && g.name === name)) {
                alert("該來賓已存在名單中！");
                renderPreloadList(); // 重新渲染刷新畫面
                return;
            }
            
            const originalHtml = btnEl.innerHTML;
            btnEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 處理中';
            btnEl.disabled = true;
            
            try {
                const newOrder = Date.now(); 
                await addDoc(itemsCollection, {
                    title: title.toString().trim(),
                    name: name.toString().trim(),
                    status: 'waiting',
                    customOrder: newOrder,
                    createdAt: serverTimestamp(),
                    createdBy: currentUser.uid
                });
                
                const successMsg = document.getElementById('success-msg');
                successMsg.classList.remove('hidden');
                setTimeout(() => successMsg.classList.add('hidden'), 3000);
            } catch(error) {
                console.error("Quick Check-in failed:", error);
                btnEl.innerHTML = originalHtml;
                btnEl.disabled = false;
                alert("簽到失敗，請重試。");
            }
        };

        // --- Modal & Deletion Logic ---

        window.openPasswordModal = (desc, password, action) => {
            document.getElementById('modal-desc').innerHTML = desc;
            document.getElementById('modal-password').value = '';
            document.getElementById('modal-error').innerText = '';
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('modal-password').focus();
            
            pendingAction = action;
            requiredPassword = password;
        };

        window.closePasswordModal = () => {
            document.getElementById('password-modal').classList.add('hidden');
            pendingAction = null;
            requiredPassword = '';
        };

        window.confirmPasswordAction = () => {
            const inputPwd = document.getElementById('modal-password').value;
            if (inputPwd === requiredPassword) {
                if (pendingAction) pendingAction();
                closePasswordModal();
            } else {
                document.getElementById('modal-error').innerText = '密碼錯誤';
                document.getElementById('modal-password').classList.add('border-red-500');
                setTimeout(() => document.getElementById('modal-password').classList.remove('border-red-500'), 2000);
            }
        };

        window.requestDelete = (id, pwd) => {
            window.openPasswordModal(
                "即將刪除此來賓資料，此動作無法復原。",
                pwd,
                async () => {
                    try {
                        await deleteDoc(doc(itemsCollection, id));
                    } catch (error) {
                        console.error("Delete failed:", error);
                    }
                }
            );
        };
        
        // 主持端專用的無密碼直接刪除功能
        window.directDelete = async (id) => {
            if (confirm("確定要將此來賓從【已介紹名單】中徹底刪除嗎？\n(此動作無法復原)")) {
                try {
                    await deleteDoc(doc(itemsCollection, id));
                } catch (error) {
                    console.error("Delete failed:", error);
                    alert("刪除失敗");
                }
            }
        };

        window.requestClearAll = () => {
            window.openPasswordModal(
                "警告：即將清空「所有」名單！此動作極度危險且無法復原。<br><span class='text-emerald-400 font-bold mt-2 block'>提示：四個4</span>",
                "4444",
                async () => {
                    try {
                        if (allGuests.length === 0) return;
                        const batch = writeBatch(db);
                        allGuests.forEach(guest => {
                            const docRef = doc(itemsCollection, guest.id);
                            batch.delete(docRef);
                        });
                        await batch.commit();
                        console.log("All data cleared");
                    } catch (error) {
                        console.error("Clear all failed:", error);
                    }
                }
            );
        };

        window.saveNewOrder = async () => {
            const listContainer = document.getElementById('host-list-waiting');
            if (!listContainer) return;

            const itemEls = Array.from(listContainer.children);
            const batch = writeBatch(db);
            let hasUpdates = false;
            const baseTime = Date.now();

            itemEls.forEach((el, index) => {
                const id = el.getAttribute('data-id');
                if (id) {
                    const docRef = doc(itemsCollection, id);
                    batch.update(docRef, { customOrder: baseTime + index });
                    hasUpdates = true;
                }
            });

            if (hasUpdates) {
                try {
                    await batch.commit();
                } catch (err) {
                    console.error("Failed to update order:", err);
                }
            }
        };

        // UI Logic
        window.toggleTheme = () => {
            document.documentElement.classList.toggle('light-mode');
            const icon = document.getElementById('theme-icon');
            if (document.documentElement.classList.contains('light-mode')) {
                icon.classList.replace('fa-sun', 'fa-moon');
                icon.classList.replace('text-yellow-400', 'text-gray-600');
            } else {
                icon.classList.replace('fa-moon', 'fa-sun');
                icon.classList.replace('text-gray-600', 'text-yellow-400');
            }
        };

        window.verifyHost = () => {
            const pwd = document.getElementById('host-password').value;
            if (pwd === '333') {
                router.navigate('host-dashboard');
            } else {
                const err = document.getElementById('login-error');
                err.classList.remove('hidden');
                document.getElementById('host-password').classList.add('border-red-500');
            }
        };

        window.switchHostTab = (tab) => {
            hostTabState = tab;
            const tabWaiting = document.getElementById('tab-waiting');
            const tabIntroduced = document.getElementById('tab-introduced');
            const listWaiting = document.getElementById('host-list-waiting');
            const listIntroduced = document.getElementById('host-list-introduced');

            if (tab === 'waiting') {
                tabWaiting.className = 'flex-1 py-3 text-base font-bold transition-colors tab-active-host';
                tabIntroduced.className = 'flex-1 py-3 text-base font-bold transition-colors tab-inactive';
                listWaiting.classList.remove('hidden');
                listIntroduced.classList.add('hidden');
            } else {
                tabWaiting.className = 'flex-1 py-3 text-base font-bold transition-colors tab-inactive';
                tabIntroduced.className = 'flex-1 py-3 text-base font-bold transition-colors tab-active-host';
                listWaiting.classList.add('hidden');
                listIntroduced.classList.remove('hidden');
            }
        };

        window.switchReceptionTab = (tab) => {
            receptionTabState = tab;
            const tabs = {
                'input': { btn: 'rec-tab-input', content: 'rec-content-input', activeClass: 'tab-active', flex: true },
                'list': { btn: 'rec-tab-list', content: 'rec-content-list', activeClass: 'tab-active', flex: false },
                'introduced': { btn: 'rec-tab-introduced', content: 'rec-content-introduced', activeClass: 'tab-active', flex: false }
            };

            Object.keys(tabs).forEach(k => {
                const t = tabs[k];
                const btnEl = document.getElementById(t.btn);
                const contentEl = document.getElementById(t.content);
                
                if (k === tab) {
                    btnEl.className = `flex-1 py-3 px-1 text-sm sm:text-base font-bold transition-colors ${t.activeClass}`;
                    contentEl.classList.remove('hidden');
                    if(t.flex) contentEl.classList.add('flex');
                } else {
                    btnEl.className = `flex-1 py-3 px-1 text-sm sm:text-base font-bold transition-colors tab-inactive`;
                    contentEl.classList.add('hidden');
                    if(t.flex) contentEl.classList.remove('flex');
                }
            });
        };

        function renderGuests() {
            const hostListWaiting = document.getElementById('host-list-waiting');
            const hostListIntroduced = document.getElementById('host-list-introduced');
            const badgeWaiting = document.getElementById('count-waiting-badge');
            const badgeIntroduced = document.getElementById('count-introduced-badge');
            
            const receptionListContainer = document.getElementById('reception-list-container');
            const receptionIntroListContainer = document.getElementById('reception-intro-list-container');
            const receptionCount = document.getElementById('reception-count');
            const receptionCountIntro = document.getElementById('reception-count-intro');

            hostListWaiting.innerHTML = '';
            hostListIntroduced.innerHTML = '';
            receptionListContainer.innerHTML = '';
            receptionIntroListContainer.innerHTML = '';

            let cWait = 0;
            let cIntro = 0;

            allGuests.forEach(guest => {
                const isIntroduced = guest.status === 'introduced';

                // ================= Reception 端渲染 =================
                if (!isIntroduced) {
                    // 未介紹 (接待端)
                    const recItem = document.createElement('div');
                    recItem.className = 'flex justify-between items-center bg-gray-900 p-4 rounded-lg border border-gray-700 shadow-sm';
                    recItem.innerHTML = `
                        <div class="overflow-hidden flex-1 mr-2">
                            <div class="text-cyan-400 font-bold text-lg break-words">${guest.title}</div>
                            <div class="text-gray-300 text-base break-words">${guest.name}</div>
                        </div>
                        <button onclick="requestDelete('${guest.id}', '333')" class="flex-none bg-gray-800 text-gray-500 hover:text-red-400 hover:bg-gray-700 transition-colors p-3 rounded-lg border border-gray-600">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    `;
                    receptionListContainer.appendChild(recItem);
                } else {
                    // 已介紹 (接待端)
                    const recIntroItem = document.createElement('div');
                    recIntroItem.className = 'flex justify-between items-center bg-gray-900 p-4 rounded-lg border border-gray-700 shadow-sm opacity-60';
                    recIntroItem.innerHTML = `
                        <div class="overflow-hidden flex-1 mr-2">
                            <div class="text-yellow-400 font-bold text-lg break-words">${guest.title}</div>
                            <div class="text-gray-300 text-base break-words">${guest.name}</div>
                        </div>
                        <div class="text-emerald-500 mr-2"><i class="fas fa-check-double text-xl"></i></div>
                    `;
                    receptionIntroListContainer.appendChild(recIntroItem);
                }

                // ================= Host 端渲染 =================
                const card = document.createElement('div');
                card.setAttribute('data-id', guest.id); 
                
                const cardStyle = isIntroduced
                    ? 'bg-gray-900 border-gray-700'
                    : 'bg-gray-800 border-cyan-500/50 text-white shadow-[0_0_10px_rgba(6,182,212,0.15)] active:bg-gray-700 active:border-cyan-400';
                
                card.className = `
                    w-full relative rounded-xl border-2 p-4 sm:p-6
                    transition-colors transform 
                    flex flex-col justify-center min-h-[100px]
                    ${cardStyle}
                `;
                
                const dragHandle = !isIntroduced 
                    ? `<div class="drag-handle flex-none mr-4 text-gray-500 hover:text-cyan-400 cursor-grab p-2"><i class="fas fa-grip-lines text-2xl"></i></div>` 
                    : '';

                const statusIcon = isIntroduced 
                    ? `<div onclick="event.stopPropagation(); window.toggleGuestStatus('${guest.id}', '${guest.status || 'waiting'}')" class="p-3 sm:p-4 bg-gray-800 hover:bg-gray-700 rounded-lg border border-gray-600 flex flex-col items-center justify-center cursor-pointer transition-colors shadow-sm"><i class="fas fa-undo text-gray-400 text-xl sm:text-2xl mb-1"></i><span class="text-xs text-gray-400 font-bold whitespace-nowrap">回未介紹</span></div>`
                    : '<i class="fas fa-check text-cyan-500 text-3xl opacity-50"></i>';

                // 主持端已介紹列表，刪除不需密碼，直接呼叫 directDelete
                const deleteBtnHost = isIntroduced
                    ? `<div onclick="event.stopPropagation(); directDelete('${guest.id}')" class="flex-none ml-2 p-3 sm:p-4 bg-red-900/30 hover:bg-red-500 rounded-lg border border-red-900/50 hover:border-red-500 flex flex-col items-center justify-center cursor-pointer z-20 transition-colors shadow-sm group"><i class="fas fa-trash-alt text-red-500 group-hover:text-white text-xl sm:text-2xl mb-1"></i><span class="text-xs text-red-500 group-hover:text-white font-bold whitespace-nowrap">刪除</span></div>`
                    : '';

                card.innerHTML = `
                    <div class="flex items-center justify-between w-full h-full">
                        ${dragHandle}
                        <div class="flex-1 pr-2 cursor-pointer h-full flex flex-col justify-center" onclick="window.toggleGuestStatus('${guest.id}', '${guest.status || 'waiting'}')">
                            <div class="font-bold text-3xl sm:text-4xl break-words leading-tight ${isIntroduced ? 'text-yellow-400' : 'text-cyan-300'}" style="word-break: break-word;">${guest.title}</div>
                            <div class="text-2xl sm:text-3xl mt-1 break-words leading-tight text-white" style="word-break: break-word;">${guest.name}</div>
                        </div>
                        <div class="flex-none pt-1 flex items-stretch h-full">
                            ${isIntroduced ? statusIcon : `<div class="flex items-center" onclick="window.toggleGuestStatus('${guest.id}', '${guest.status || 'waiting'}')">${statusIcon}</div>`}
                            ${deleteBtnHost}
                        </div>
                    </div>
                `;

                if (isIntroduced) {
                    hostListIntroduced.appendChild(card);
                    cIntro++;
                } else {
                    hostListWaiting.appendChild(card);
                    cWait++;
                }
            });

            badgeWaiting.innerText = cWait;
            badgeIntroduced.innerText = cIntro;
            receptionCount.innerText = cWait;
            receptionCountIntro.innerText = cIntro;

            // 每次渲染來賓後，同步過濾預先輸入名單，把已經簽到的按鈕隱藏
            renderPreloadList();

            if (!sortableInstance && document.getElementById('host-list-waiting')) {
                sortableInstance = new Sortable(document.getElementById('host-list-waiting'), {
                    handle: '.drag-handle',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    onEnd: function (evt) {
                        window.saveNewOrder();
                    }
                });
            }
        }

        initApp();
    </script>
</body>
</html>
